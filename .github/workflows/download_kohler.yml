name: Télécharger les illustrations Köhler

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: claude/kdp-coloring-book-generator-1KR79

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests

      - name: Télécharger les images Köhler
        run: python fetcher.py

      - name: Enregistrer les images dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kohler_images/
          git diff --staged --quiet || git commit -m "Ajout des planches botaniques Köhler (téléchargement automatique)"
          git push
